[project]
name = "4-dof-service-manipulator"
version = "1.0.0"
description = "Kinematics, simulation, and Arduino trajectory control for a 4-DOF service manipulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy==2.3.5",
    "pyserial==3.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.16.10",
]

[tool.uv]
package = false
exclude-newer = "2026-10-31T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
