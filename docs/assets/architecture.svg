<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="4-DOF Service Manipulator system architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .box-teal { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .box-slate { fill: #ffffff; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #1e293b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
      .conn { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="6" y="6" width="908" height="328" class="bg"/>

  <!-- Column 1: Mechanical & DH Model -->
  <rect x="28" y="34" width="210" height="110" class="box-slate"/>
  <text x="133" y="58" text-anchor="middle" class="title">CAD &amp; DH Kinematic Model</text>
  <text x="133" y="79" text-anchor="middle" class="sub">SolidWorks 3D-Printed PLA Arm</text>
  <text x="133" y="96" text-anchor="middle" class="mono">d1=0.04355 a2=0.140 a3=0.133 a4=0.109 m</text>
  <text x="133" y="113" text-anchor="middle" class="sub">4 Active Revolute DOF + Gripper</text>
  <text x="133" y="130" text-anchor="middle" class="mono">Zero Config: z = 0.42555 m</text>

  <!-- Column 1 Bottom: Offline / CI Verification -->
  <rect x="28" y="196" width="210" height="110" class="box-blue"/>
  <text x="133" y="220" text-anchor="middle" class="title">Kinematic &amp; Path Verification</text>
  <text x="133" y="241" text-anchor="middle" class="sub">Analytical vs FD Jacobian (&lt;1e-9)</text>
  <text x="133" y="258" text-anchor="middle" class="sub">Cold-Start IK (&lt;1e-4 m Python)</text>
  <text x="133" y="275" text-anchor="middle" class="sub">pinv Velocity Roundtrip (~1e-15)</text>
  <text x="133" y="292" text-anchor="middle" class="mono">pytest (25) + Octave Docker (5)</text>

  <!-- Column 2: Solvers & Planners -->
  <rect x="300" y="96" width="250" height="148" class="box-teal"/>
  <text x="425" y="122" text-anchor="middle" class="title">IK Solvers &amp; Trajectory Planners</text>
  <text x="425" y="144" text-anchor="middle" class="sub">ROS/Python: 3x4 DLS (lambda=0.01, dt=0.1 s)</text>
  <text x="425" y="162" text-anchor="middle" class="sub">MATLAB: 3x4 pinv IK (tol=1e-3 m)</text>
  <text x="425" y="183" text-anchor="middle" class="sub">Square Pick-and-Place (Linear Cartesian)</text>
  <text x="425" y="200" text-anchor="middle" class="sub">Circular Stirring (Parametric X-Y) + Cubic</text>
  <text x="425" y="222" text-anchor="middle" class="mono">451 Waypoints Across 5 Tea-Task CSVs</text>

  <!-- Column 3 Top: Dual Simulation -->
  <rect x="618" y="34" width="268" height="110" class="box-blue"/>
  <text x="752" y="58" text-anchor="middle" class="title">Dual-Platform Simulation</text>
  <text x="752" y="80" text-anchor="middle" class="sub">ROS Noetic Gazebo + URDF Controllers</text>
  <text x="752" y="98" text-anchor="middle" class="mono">/gazebo/get_link_state @ 30 Hz</text>
  <text x="752" y="118" text-anchor="middle" class="sub">MATLAB Simscape Multibody (.slx)</text>
  <text x="752" y="133" text-anchor="middle" class="sub">13 Solid Bodies Imported from CAD</text>

  <!-- Column 3 Bottom: Arduino Hardware -->
  <rect x="618" y="196" width="268" height="110" class="box-amber"/>
  <text x="752" y="220" text-anchor="middle" class="title">Open-Loop Arduino Execution</text>
  <text x="752" y="241" text-anchor="middle" class="mono">send_trajectory.py -&gt; USB 115200 baud</text>
  <text x="752" y="258" text-anchor="middle" class="mono">q1,q2,q3,q4 / GRIPPER_* &lt;-&gt; READY</text>
  <text x="752" y="275" text-anchor="middle" class="sub">Arduino Uno PWM Pins 3, 5, 6, 9, 10</text>
  <text x="752" y="292" text-anchor="middle" class="sub">3x MG996R + SG90 Servos (12 V PSU)</text>

  <!-- Arrows -->
  <line x1="238" y1="90" x2="300" y2="140" class="conn"/>
  <line x1="238" y1="250" x2="300" y2="202" class="conn"/>
  <line x1="550" y1="142" x2="618" y2="92" class="conn"/>
  <line x1="550" y1="198" x2="618" y2="248" class="conn"/>

  <text x="584" y="106" text-anchor="middle" class="lbl">Joint Cmds</text>
  <text x="584" y="236" text-anchor="middle" class="lbl">CSV Stream</text>
</svg>
