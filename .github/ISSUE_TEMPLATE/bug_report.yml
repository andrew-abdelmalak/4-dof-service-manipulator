name: Bug report
description: Report broken kinematics math, trajectory scripts, tests, or firmware build errors.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Smallest set of commands or inputs that trigger the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Output of git rev-parse --short HEAD or release tag.
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Octave/MATLAB/ROS/arduino-cli version, and board if hardware.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant console output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
