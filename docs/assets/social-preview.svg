<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Stylized 4-DOF arm schematic on right -->
  <g transform="translate(970, 490)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-90" y="0" width="180" height="18" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#38bdf8" stroke-width="12"/>
    <line x1="0" y1="-65" x2="-95" y2="-205" stroke="#2dd4bf" stroke-width="11"/>
    <line x1="-95" y1="-205" x2="45" y2="-305" stroke="#38bdf8" stroke-width="9"/>
    <line x1="45" y1="-305" x2="135" y2="-230" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="0" cy="-65" r="11" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="-95" cy="-205" r="10" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="45" cy="-305" r="9" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="135" cy="-230" r="8" fill="#f59e0b" stroke="#f8fafc" stroke-width="2"/>
  </g>

  <!-- Left header content -->
  <rect x="84" y="88" width="160" height="34" rx="17" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="164" y="110" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc">GUC MECHATRONICS</text>

  <text x="84" y="194" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">4-DOF Service</text>
  <text x="84" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accent)">Manipulator</text>

  <text x="84" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">DH Kinematics, Dual Simulation (Gazebo &amp; Simscape),</text>
  <text x="84" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">and Arduino Trajectory Execution for Beverage Prep</text>

  <!-- Metric pills -->
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="15">
    <rect x="84" y="424" width="235" height="62" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="104" y="450" fill="#94a3b8" font-size="12">COLD-START POSITION IK</text>
    <text x="104" y="473" fill="#38bdf8" font-weight="700">&lt; 1e-4 m (Python DLS)</text>

    <rect x="339" y="424" width="245" height="62" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="359" y="450" fill="#94a3b8" font-size="12">TEA-PREP CSV SEQUENCE</text>
    <text x="359" y="473" fill="#2dd4bf" font-weight="700">451 Waypoints / 5 Phases</text>

    <rect x="604" y="424" width="225" height="62" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="624" y="450" fill="#94a3b8" font-size="12">OFFLINE &amp; CI STACK</text>
    <text x="624" y="473" fill="#f59e0b" font-weight="700">Python · Octave · AVR</text>
  </g>

  <text x="84" y="566" font-family="JetBrains Mono, Menlo, monospace" font-size="17" fill="#64748b">github.com/andrew-abdelmalak/4-dof-service-manipulator · MIT</text>
</svg>
